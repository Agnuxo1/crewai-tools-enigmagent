[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-tools-enigmagent"
version = "0.1.0"
description = "CrewAI tool for EnigmAgent — agents resolve {{PLACEHOLDER}} secrets at the call boundary so LLMs never see real API keys"
authors = [{name="Francisco Angulo de Lafuente", email="agnuxo1@gmail.com"}]
license = {text="MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["crewai","crewai-tools","enigmagent","mcp","secrets","vault","credentials","security","agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "crewai>=0.40",
  "httpx>=0.24",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/Agnuxo1/crewai-tools-enigmagent"
"Bug Tracker" = "https://github.com/Agnuxo1/crewai-tools-enigmagent/issues"
"Main Project" = "https://github.com/Agnuxo1/EnigmAgent"

[tool.hatch.build.targets.wheel]
packages = ["crewai_tools_enigmagent"]
